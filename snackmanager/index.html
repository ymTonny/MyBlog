<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>零食保质期管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #FF6B6B;
            --primary-dark: #ee5a5a;
            --warning: #FFD93D;
            --danger: #FF6B6B;
            --success: #6BCB77;
            --info: #4D96FF;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --border: #e9ecef;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100%;
            padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: env(safe-area-inset-top, 20px) 20px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }

        .header .subtitle {
            font-size: 12px;
            opacity: 0.9;
            text-align: center;
            margin-top: 5px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 15px 10px;
            margin: 10px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-item .number {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-item .number.danger {
            color: var(--danger);
        }

        .stat-item .number.warning {
            color: #e6b800;
        }

        .stat-item .number.success {
            color: var(--success);
        }

        .stat-item .label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .tabs {
            display: flex;
            background: var(--card-bg);
            margin: 10px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .tab {
            flex: 1;
            padding: 15px 10px;
            text-align: center;
            border: none;
            background: none;
            font-size: 14px;
            color: var(--text-light);
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
            -webkit-appearance: none;
            appearance: none;
        }

        .tab.active {
            color: var(--primary);
            font-weight: 600;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: var(--primary);
            border-radius: 3px;
        }

        .tab .badge {
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 4px;
            display: none;
            vertical-align: middle;
        }

        .tab .badge.show {
            display: inline-block;
        }

        .content {
            padding: 10px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.15s ease-out;
        }

        .card:active {
            transform: scale(0.99);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            word-break: break-word;
        }

        .card-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .card-status.danger {
            background: rgba(255, 107, 107, 0.15);
            color: var(--danger);
        }

        .card-status.warning {
            background: rgba(255, 217, 61, 0.25);
            color: #b38600;
        }

        .card-status.normal {
            background: rgba(107, 203, 119, 0.15);
            color: #4a9c4d;
        }

        .card-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 13px;
            color: var(--text-light);
        }

        .card-info span {
            display: flex;
            align-items: center;
            gap: 5px;
            word-break: break-word;
        }

        .card-info span.full-width {
            grid-column: span 2;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-light);
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .fab {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 999;
            -webkit-appearance: none;
            appearance: none;
        }

        .fab:hover {
            transform: scale(1.05);
        }

        .fab:active {
            transform: scale(0.95);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 2000;
            padding: 0;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            margin-top: auto;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 10;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-light);
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            -webkit-appearance: none;
            appearance: none;
        }

        .modal-body {
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .modal-footer {
            padding: 16px 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            position: sticky;
            bottom: 0;
            background: var(--card-bg);
        }

        .modal-footer .btn {
            flex: 1;
            padding: 14px 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 15px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .quick-action {
            background: var(--bg);
            border: none;
            padding: 16px 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .quick-action:active {
            background: #e9ecef;
        }

        .quick-action.selected {
            background: rgba(255, 107, 107, 0.1);
            border: 2px solid var(--primary);
        }

        .quick-action .icon {
            font-size: 28px;
            margin-bottom: 6px;
            display: block;
        }

        .quick-action span {
            font-size: 12px;
            color: var(--text-light);
        }

        .search-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .search-box input {
            flex: 1;
            border: none;
            font-size: 15px;
            outline: none;
            background: transparent;
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-tags::-webkit-scrollbar {
            display: none;
        }

        .filter-tag {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .filter-tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-tag:active {
            transform: scale(0.97);
        }

        .countdown {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .countdown.danger {
            background: rgba(255, 107, 107, 0.15);
            color: var(--danger);
        }

        .countdown.warning {
            background: rgba(255, 217, 61, 0.25);
            color: #b38600;
        }

        .countdown.safe {
            background: rgba(107, 203, 119, 0.15);
            color: #4a9c4d;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            max-width: 80%;
            text-align: center;
            word-break: break-word;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .scanner-overlay.show {
            display: flex;
        }

        .scanner-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: calc(env(safe-area-inset-top, 20px) + 20px) 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            z-index: 10;
        }

        .scanner-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .scanner-close {
            background: none;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            padding: 10px;
            line-height: 1;
        }

        #scannerVideo {
            width: 100%;
            max-width: 400px;
            height: auto;
            max-height: 60vh;
            object-fit: cover;
            border-radius: 12px;
        }

        .scanner-tip {
            color: white;
            text-align: center;
            margin-top: 20px;
            padding: 0 20px;
            font-size: 14px;
            opacity: 0.8;
        }

        .scanner-tips {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-top: 15px;
            padding: 0 20px;
            font-size: 12px;
        }

        .scanner-tips p {
            margin: 4px 0;
        }

        .manual-input {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            padding: 0 20px;
            max-width: 400px;
            width: 100%;
        }

        .manual-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            text-align: center;
        }

        .manual-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .manual-input button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        @media (max-width: 380px) {
            .card-info {
                grid-template-columns: 1fr;
            }
            .card-info span.full-width {
                grid-column: span 1;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .fab {
                bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }

        .header-actions {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .header-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .settings-modal .modal-content {
            padding-bottom: 0;
        }

        .settings-list {
            padding: 0;
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .settings-item:active {
            background-color: var(--bg);
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-item .label {
            font-size: 15px;
            color: var(--text);
        }

        .settings-item .value {
            font-size: 13px;
            color: var(--text-light);
        }

        .settings-item .arrow {
            color: var(--text-light);
            font-size: 12px;
        }

        .data-info {
            background: var(--bg);
            padding: 12px 20px;
            font-size: 12px;
            color: var(--text-light);
        }

        .file-input {
            display: none;
        }

        .import-status {
            text-align: center;
            padding: 20px;
        }

        .import-status.success {
            color: var(--success);
        }

        .import-status.error {
            color: var(--danger);
        }

        .camera-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            -webkit-appearance: none;
            appearance: none;
        }

        .image-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
        }

        .image-viewer.show {
            display: flex;
        }

        .image-viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            cursor: default;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍿 零食保质期管理</h1>
        <div class="subtitle">小卖部专用</div>
        <div class="header-actions">
            <button class="header-btn" id="settingsBtn">⚙️</button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="number danger" id="expiredCount">0</div>
            <div class="label">已过期</div>
        </div>
        <div class="stat-item">
            <div class="number warning" id="expiringCount">0</div>
            <div class="label">即将到期</div>
        </div>
        <div class="stat-item">
            <div class="number success" id="normalCount">0</div>
            <div class="label">正常</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="all">全部</button>
        <button class="tab" data-tab="expired">
            已过期
            <span class="badge" id="expiredBadge">0</span>
        </button>
        <button class="tab" data-tab="expiring">
            即将到期
            <span class="badge" id="expiringBadge">0</span>
        </button>
    </div>

    <div class="content">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="搜索零食名称...">
        </div>

        <div class="filter-tags">
            <button class="filter-tag active" data-filter="all">全部</button>
            <button class="filter-tag" data-filter="零食">零食</button>
            <button class="filter-tag" data-filter="饮料">饮料</button>
            <button class="filter-tag" data-filter="糖果">糖果</button>
            <button class="filter-tag" data-filter="膨化">膨化</button>
            <button class="filter-tag" data-filter="其他">其他</button>
        </div>

        <div id="snackList"></div>
    </div>

    <button class="fab" id="addBtn">+</button>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加零食</h2>
                <div style="display:flex;align-items:center;gap:8px;">
                    <button class="camera-btn" id="cameraBtn" title="拍照识别添加">📷</button>
                    <button class="modal-close" id="closeModal">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="quick-actions">
                    <button class="quick-action" data-category="零食">
                        <span class="icon">🍪</span>
                        <span>零食</span>
                    </button>
                    <button class="quick-action" data-category="饮料">
                        <span class="icon">🥤</span>
                        <span>饮料</span>
                    </button>
                    <button class="quick-action" data-category="糖果">
                        <span class="icon">🍬</span>
                        <span>糖果</span>
                    </button>
                    <button class="quick-action" data-category="膨化">
                        <span class="icon">🍟</span>
                        <span>膨化</span>
                    </button>
                    <button class="quick-action" data-category="其他">
                        <span class="icon">📦</span>
                        <span>其他</span>
                    </button>
                </div>
                <div class="form-group">
                    <label>零食名称 *</label>
                    <input type="text" id="snackName" placeholder="输入零食名称" autocomplete="off">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>分类</label>
                        <select id="snackCategory">
                            <option value="零食">零食</option>
                            <option value="饮料">饮料</option>
                            <option value="糖果">糖果</option>
                            <option value="膨化">膨化</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        const STORAGE_KEY = 'snack_inventory';
        const IMAGE_STORE_KEY = 'snack_image_store';
        let snacks = [];
        let imageStore = {};
        let imageDBPromise = null;
        let currentTab = 'all';
        let currentFilter = 'all';
        let searchKeyword = '';
        let html5QrCode = null;
        let isScanning = false;
        let currentImageData = '';

        function init() {
            loadData();
            loadImageStore().then(function() {
                renderSnacks();
                updateStats();
                updateDataInfo();
                setDefaultDate();
                bindEvents();
            });
        }

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    snacks = JSON.parse(data);
                } catch (e) {
                    console.error('数据解析失败', e);
                    snacks = [];
                }
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(snacks));
                cleanupImageStore();
            } catch (e) {
                console.error('数据保存失败', e);
                showToast('数据保存失败，请检查存储空间');
            }
        }

        function getImageDB() {
            if (!imageDBPromise) {
                imageDBPromise = new Promise(function(resolve, reject) {
                    var request = indexedDB.open('SnackManagerDB', 1);
                    request.onerror = function() { reject(request.error); };
                    request.onsuccess = function() {
                        var db = request.result;
                        db.onversionchange = function() { db.close(); };
                        resolve(db);
                    };
                    request.onupgradeneeded = function(e) {
                        var db = e.target.result;
                        if (!db.objectStoreNames.contains('images')) {
                            db.createObjectStore('images');
                        }
                    };
                });
            }
            return imageDBPromise;
        }

        function loadImageStore() {
            return getImageDB().then(function(db) {
                return new Promise(function(resolve) {
                    var lsData = localStorage.getItem(IMAGE_STORE_KEY);
                    if (lsData) {
                        try {
                            var oldImages = JSON.parse(lsData);
                            var tx = db.transaction('images', 'readwrite');
                            var store = tx.objectStore('images');
                            for (var k in oldImages) {
                                if (oldImages.hasOwnProperty(k)) store.put(oldImages[k], k);
                            }
                            localStorage.removeItem(IMAGE_STORE_KEY);
                        } catch(e) {}
                    }
                    var toMigrate = [];
                    for (var i = 0; i < snacks.length; i++) {
                        if (snacks[i].image && snacks[i].image.indexOf('data:') === 0) {
                            toMigrate.push(snacks[i]);
                        }
                    }
                    if (toMigrate.length === 0) { resolve(); return; }
                    var tx = db.transaction('images', 'readwrite');
                    var store = tx.objectStore('images');
                    for (var i = 0; i < toMigrate.length; i++) {
                        var s = toMigrate[i];
                        var key = hashImage(s.image);
                        store.put(s.image, key);
                        imageStore[key] = s.image;
                        s.image = key;
                    }
                    tx.oncomplete = function() {
                        saveData();
                        resolve();
                    };
                });
            });
        }

        function saveImageStore() {
            getImageDB().then(function(db) {
                var tx = db.transaction('images', 'readwrite');
                var store = tx.objectStore('images');
                store.clear();
                for (var k in imageStore) {
                    if (imageStore.hasOwnProperty(k)) store.put(imageStore[k], k);
                }
                tx.onerror = function() { console.error('IndexedDB写入失败'); };
            }).catch(function(e) {
                console.error('图片存储失败', e);
            });
        }

        function hashImage(dataUrl) {
            var hash = 0;
            for (var i = 0; i < dataUrl.length; i++) {
                var char = dataUrl.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return 'i' + Math.abs(hash).toString(36);
        }

        function storeImage(dataUrl) {
            if (!dataUrl) return '';
            var key = hashImage(dataUrl);
            if (!imageStore[key]) {
                imageStore[key] = dataUrl;
                saveImageStore();
            }
            return key;
        }

        function getStoredImage(key) {
            if (!key) return '';
            if (key.indexOf('data:') === 0) return key;
            return imageStore[key] || '';
        }

        function loadImageAsync(key) {
            if (!key) return Promise.resolve('');
            if (key.indexOf('data:') === 0) return Promise.resolve(key);
            if (imageStore[key]) return Promise.resolve(imageStore[key]);
            return getImageDB().then(function(db) {
                return new Promise(function(resolve) {
                    var tx = db.transaction('images', 'readonly');
                    var store = tx.objectStore('images');
                    var req = store.get(key);
                    req.onsuccess = function() {
                        var data = req.result || '';
                        if (data) imageStore[key] = data;
                        resolve(data);
                    };
                    req.onerror = function() { resolve(''); };
                });
            });
        }

        function loadCardImages(container) {
            var imgs = container.querySelectorAll('[data-imgkey]');
            for (var i = 0; i < imgs.length; i++) {
                (function(img) {
                    var key = img.getAttribute('data-imgkey');
                    var cached = getStoredImage(key);
                    if (cached) {
                        img.src = cached;
                        img.onclick = function(e) { e.stopPropagation(); viewImage(cached); };
                    } else {
                        loadImageAsync(key).then(function(src) {
                            if (src) {
                                img.src = src;
                                img.onclick = function(e) { e.stopPropagation(); viewImage(src); };
                            }
                        });
                    }
                })(imgs[i]);
            }
        }

        function cleanupImageStore() {
            var usedKeys = {};
            for (var i = 0; i < snacks.length; i++) {
                if (snacks[i].image && snacks[i].image.indexOf('data:') !== 0) {
                    usedKeys[snacks[i].image] = true;
                }
            }
            var changed = false;
            for (var k in imageStore) {
                if (imageStore.hasOwnProperty(k) && !usedKeys[k]) {
                    delete imageStore[k];
                    changed = true;
                }
            }
            if (changed) saveImageStore();
        }

        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('snackProductionDate').value = today;
        }

        function bindEvents() {
            const addBtn = document.getElementById('addBtn');
            const addModal = document.getElementById('addModal');
            const closeModal = document.getElementById('closeModal');
            const cancelAdd = document.getElementById('cancelAdd');
            const confirmAdd = document.getElementById('confirmAdd');

            addBtn.addEventListener('click', function(e) {
                e.preventDefault();
                addModal.classList.add('show');
                setDefaultDate();
                document.body.style.overflow = 'hidden';
            });

            document.getElementById('cameraBtn').addEventListener('click', function() {
                document.getElementById('cameraInput').click();
            });

            document.getElementById('editCameraBtn').addEventListener('click', function() {
                document.getElementById('cameraInput').click();
            });

            document.getElementById('cameraInput').addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    handleCameraCapture(e.target.files[0]);
                }
            });

            document.getElementById('removeAddImage').addEventListener('click', function() {
                currentImageData = '';
                document.getElementById('addImagePreview').style.display = 'none';
            });

            document.getElementById('removeEditImage').addEventListener('click', function() {
                currentImageData = '';
                document.getElementById('editImagePreview').style.display = 'none';
            });

            function closeAddModal() {
                addModal.classList.remove('show');
                clearForm();
                document.body.style.overflow = '';
            }

            closeModal.addEventListener('click', closeAddModal);
            cancelAdd.addEventListener('click', closeAddModal);
            confirmAdd.addEventListener('click', addSnack);

            addModal.addEventListener('click', function(e) {
                if (e.target === e.currentTarget) {
                    closeAddModal();
                }
            });

            const editModal = document.getElementById('editModal');
            const closeEditModal = document.getElementById('closeEditModal');
            const cancelEdit = document.getElementById('cancelEdit');
            const confirmEdit = document.getElementById('confirmEdit');

            function closeEditFn() {
                editModal.classList.remove('show');
                document.body.style.overflow = '';
            }

            closeEditModal.addEventListener('click', closeEditFn);
            cancelEdit.addEventListener('click', closeEditFn);
            confirmEdit.addEventListener('click', updateSnack);

            editModal.addEventListener('click', function(e) {
                if (e.target === e.currentTarget) {
                    closeEditFn();
                }
            });

            document.querySelectorAll('.tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(function(t) {
                        t.classList.remove('active');
                    });
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    renderSnacks();
                });
            });

            document.querySelectorAll('.filter-tag').forEach(function(tag) {
                tag.addEventListener('click', function() {
                    document.querySelectorAll('.filter-tag').forEach(function(t) {
                        t.classList.remove('active');
                    });
                    tag.classList.add('active');
                    currentFilter = tag.dataset.filter;
                    renderSnacks();
                });
            });

            document.getElementById('searchInput').addEventListener('input', function(e) {
                searchKeyword = e.target.value.trim().toLowerCase();
                renderSnacks();
            });

            document.querySelectorAll('.quick-action[data-category]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.getElementById('snackCategory').value = btn.dataset.category;
                    document.querySelectorAll('.quick-action').forEach(function(b) {
                        b.classList.remove('selected');
                    });
                    btn.classList.add('selected');
                });
            });
            var settingsBtn = document.getElementById('settingsBtn');
            var settingsModal = document.getElementById('settingsModal');
            var closeSettings = document.getElementById('closeSettings');
            var closeSettingsBtn = document.getElementById('closeSettingsBtn');
            var exportData = document.getElementById('exportData');
            var importData = document.getElementById('importData');
            var clearData = document.getElementById('clearData');
            var importFile = document.getElementById('importFile');

            function closeSettingsFn() {
                settingsModal.classList.remove('show');
                document.body.style.overflow = '';
            }

            settingsBtn.addEventListener('click', function() {
                updateDataInfo();
                settingsModal.classList.add('show');
                document.body.style.overflow = 'hidden';
            });

            closeSettings.addEventListener('click', closeSettingsFn);
            closeSettingsBtn.addEventListener('click', closeSettingsFn);

            settingsModal.addEventListener('click', function(e) {
                if (e.target === e.currentTarget) {
                    closeSettingsFn();
                }
            });

            exportData.addEventListener('click', function() {
                exportDataToFile();
            });

            importData.addEventListener('click', function() {
                importFile.click();
            });

            importFile.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    importDataFromFile(e.target.files[0]);
                }
            });

            clearData.addEventListener('click', function() {
                    if (confirm('确定要清空所有数据吗？此操作不可恢复！')) {
                        if (confirm('再次确认：确定要删除所有零食记录吗？')) {
                            snacks = [];
                            imageStore = {};
                            getImageDB().then(function(db) {
                                var tx = db.transaction('images', 'readwrite');
                                var store = tx.objectStore('images');
                                store.clear();
                            });
                            saveData();
                            renderSnacks();
                            updateStats();
                            updateDataInfo();
                            showToast('数据已清空');
                        }
                    }
            });
        }

        function isHttps() {
            return location.protocol === 'https:' || 
                   location.hostname === 'localhost' || 
                   location.hostname === '127.0.0.1';
        }

        function checkCameraPermission() {
            return navigator.permissions && navigator.permissions.query({ name: 'camera' })
                .then(function(permissionStatus) {
                    return permissionStatus.state;
                })
                .catch(function() {
                    return 'unknown';
                });
        }

        function requestCameraPermission() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                return navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                    .then(function(stream) {
                        stream.getTracks().forEach(function(track) {
                            track.stop();
                        });
                        return true;
                    })
                    .catch(function() {
                        return false;
                    });
            }
            return Promise.resolve(false);
        }

        function clearForm() {
            document.getElementById('snackName').value = '';
            document.getElementById('snackQuantity').value = '1';
            document.getElementById('snackShelfLife').value = '';
            document.getElementById('snackCost').value = '';
            document.getElementById('snackRemark').value = '';
            document.querySelectorAll('.quick-action').forEach(function(b) {
                b.classList.remove('selected');
            });
            currentImageData = '';
            document.getElementById('addImagePreview').style.display = 'none';
        }

        function addSnack() {
            const name = document.getElementById('snackName').value.trim();
            const category = document.getElementById('snackCategory').value;
            const quantity = parseInt(document.getElementById('snackQuantity').value, 10) || 1;
            const productionDate = document.getElementById('snackProductionDate').value;
            const shelfLife = parseInt(document.getElementById('snackShelfLife').value, 10);
            const cost = parseFloat(document.getElementById('snackCost').value) || 0;
            const remark = document.getElementById('snackRemark').value.trim();

            if (!productionDate || !shelfLife) {
                showToast('请填写必填项');
                return;
            }

            const snack = {
                id: Date.now(),
                name: name,
                category: category,
                quantity: quantity,
                productionDate: productionDate,
                shelfLife: shelfLife,
                cost: cost,
                remark: remark,
                image: storeImage(currentImageData),
                createdAt: new Date().toISOString()
            };

            snacks.unshift(snack);
            saveData();
            renderSnacks();
            updateStats();
            document.getElementById('addModal').classList.remove('show');
            clearForm();
            document.body.style.overflow = '';
            showToast('添加成功');
        }

        function updateSnack() {
            const id = parseInt(document.getElementById('editId').value, 10);
            const name = document.getElementById('editName').value.trim();
            const category = document.getElementById('editCategory').value;
            const quantity = parseInt(document.getElementById('editQuantity').value, 10) || 1;
            const productionDate = document.getElementById('editProductionDate').value;
            const shelfLife = parseInt(document.getElementById('editShelfLife').value, 10);
            const cost = parseFloat(document.getElementById('editCost').value) || 0;
            const remark = document.getElementById('editRemark').value.trim();

            if (!productionDate || !shelfLife) {
                showToast('请填写必填项');
                return;
            }

            const index = snacks.findIndex(function(s) {
                return s.id === id;
            });
            if (index !== -1) {
                snacks[index] = {
                    id: id,
                    name: name,
                    category: category,
                    quantity: quantity,
                    productionDate: productionDate,
                    shelfLife: shelfLife,
                    cost: cost,
                    remark: remark,
                    image: currentImageData ? storeImage(currentImageData) : snacks[index].image,
                    createdAt: snacks[index].createdAt
                };
                saveData();
                renderSnacks();
                updateStats();
                document.getElementById('editModal').classList.remove('show');
                document.body.style.overflow = '';
                showToast('更新成功');
            }
        }

        function deleteSnack(id) {
            if (confirm('确定要删除这个零食吗？')) {
                snacks = snacks.filter(function(s) {
                    return s.id !== id;
                });
                saveData();
                renderSnacks();
                updateStats();
                showToast('已删除');
            }
        }

        function editSnack(id) {
            const snack = snacks.find(function(s) {
                return s.id === id;
            });
            if (snack) {
                document.getElementById('editId').value = snack.id;
                document.getElementById('editName').value = snack.name;
                document.getElementById('editCategory').value = snack.category;
                document.getElementById('editQuantity').value = snack.quantity;
                document.getElementById('editProductionDate').value = snack.productionDate;
                document.getElementById('editShelfLife').value = snack.shelfLife;
                document.getElementById('editCost').value = snack.cost;
                document.getElementById('editRemark').value = snack.remark || '';
                loadImageAsync(snack.image || '').then(function(src) {
                    currentImageData = src || '';
                    if (currentImageData) {
                        document.getElementById('editImagePreview').style.display = '';
                        document.getElementById('editImagePreviewImg').src = currentImageData;
                    } else {
                        document.getElementById('editImagePreview').style.display = 'none';
                    }
                });
                document.getElementById('editModal').classList.add('show');
                document.body.style.overflow = 'hidden';
            }
        }

        function getSnackStatus(snack) {
            const productionDate = new Date(snack.productionDate);
            const expirationDate = new Date(productionDate);
            expirationDate.setDate(productionDate.getDate() + snack.shelfLife);

            const today = new Date();
            const daysLeft = Math.ceil((expirationDate - today) / (1000 * 60 * 60 * 24));

            if (daysLeft < 0) {
                return { status: 'danger', label: '已过期', daysLeft: daysLeft, class: 'danger' };
            } else if (daysLeft <= 20) {
                return { status: 'warning', label: '即将到期', daysLeft: daysLeft, class: 'warning' };
            } else {
                return { status: 'normal', label: '正常', daysLeft: daysLeft, class: 'safe' };
            }
        }

        function getCategoryIcon(category) {
            var icons = {
                '零食': '🍪',
                '饮料': '🥤',
                '糖果': '🍬',
                '膨化': '🍟',
                '其他': '📦'
            };
            return icons[category] || '📦';
        }

        function updateStats() {
            var expired = 0;
            var expiring = 0;
            var normal = 0;
            var i;

            for (i = 0; i < snacks.length; i++) {
                var status = getSnackStatus(snacks[i]);
                if (status.status === 'danger') {
                    expired++;
                } else if (status.status === 'warning') {
                    expiring++;
                } else {
                    normal++;
                }
            }

            document.getElementById('expiredCount').textContent = expired;
            document.getElementById('expiringCount').textContent = expiring;
            document.getElementById('normalCount').textContent = normal;

            var expiredBadge = document.getElementById('expiredBadge');
            var expiringBadge = document.getElementById('expiringBadge');

            if (expired > 0) {
                expiredBadge.textContent = expired;
                expiredBadge.classList.add('show');
            } else {
                expiredBadge.classList.remove('show');
            }

            if (expiring > 0) {
                expiringBadge.textContent = expiring;
                expiringBadge.classList.add('show');
            } else {
                expiringBadge.classList.remove('show');
            }
        }

        function renderSnacks() {
            var filtered = snacks;
            var i;

            if (currentTab === 'expired') {
                filtered = filtered.filter(function(s) {
                    return getSnackStatus(s).status === 'danger';
                });
            } else if (currentTab === 'expiring') {
                filtered = filtered.filter(function(s) {
                    return getSnackStatus(s).status === 'warning';
                });
            }

            if (currentFilter !== 'all') {
                filtered = filtered.filter(function(s) {
                    return s.category === currentFilter;
                });
            }

            if (searchKeyword) {
                filtered = filtered.filter(function(s) {
                    return s.name.toLowerCase().indexOf(searchKeyword) !== -1 ||
                           (s.remark && s.remark.toLowerCase().indexOf(searchKeyword) !== -1);
                });
            }

            var container = document.getElementById('snackList');

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无零食记录</p></div>';
                return;
            }

            var html = '';
            for (i = 0; i < filtered.length; i++) {
                var snack = filtered[i];
                var status = getSnackStatus(snack);
                var productionDate = new Date(snack.productionDate);
                var expirationDate = new Date(productionDate);
                expirationDate.setDate(productionDate.getDate() + snack.shelfLife);

                var countdownText;
                if (status.daysLeft < 0) {
                    countdownText = '过期' + Math.abs(status.daysLeft) + '天';
                } else {
                    countdownText = '剩余' + status.daysLeft + '天';
                }

                html += '<div class="card" data-id="' + snack.id + '">';
                html += '<div class="card-header">';
                html += '<span class="card-title">' + getCategoryIcon(snack.category) + ' ' + escapeHtml(snack.name) + '</span>';
                html += '<span class="card-status ' + status.status + '">' + status.label + '</span>';
                html += '</div>';
                if (snack.image) {
                    html += '<div style="margin-bottom:8px;background:#f0f0f0;border-radius:8px;min-height:50px;"><img data-imgkey="' + snack.image + '" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="width:100%;max-height:150px;object-fit:cover;border-radius:8px;cursor:pointer;display:block;" loading="lazy"></div>';
                }
                html += '<div class="card-info">';
                html += '<span>📦 数量: ' + snack.quantity + '</span>';
                html += '<span>🏷️ ' + snack.category + '</span>';
                html += '<span>📅 生产: ' + snack.productionDate + '</span>';
                html += '<span>⏰ 到期: ' + expirationDate.toLocaleDateString() + '</span>';
                html += '<span>💰 进价: ¥' + snack.cost.toFixed(2) + '</span>';
                html += '<span class="countdown ' + status.class + '">' + countdownText + '</span>';
                if (snack.remark) {
                    html += '<span class="full-width">📝 ' + escapeHtml(snack.remark) + '</span>';
                }
                html += '</div>';
                html += '<div class="card-actions">';
                html += '<button class="btn btn-outline" onclick="window.editSnack(' + snack.id + ')">编辑</button>';
                html += '<button class="btn btn-danger" onclick="window.deleteSnack(' + snack.id + ')">删除</button>';
                html += '</div>';
                html += '</div>';
            }

            container.innerHTML = html;
            loadCardImages(container);
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateDataInfo() {
            document.getElementById('totalCount').textContent = snacks.length;
        }

        function exportDataToFile() {
            if (snacks.length === 0) {
                showToast('没有数据可导出');
                return;
            }

            var exportData = {
                version: '1.1',
                exportTime: new Date().toISOString(),
                count: snacks.length,
                data: snacks,
                images: imageStore
            };

            var jsonStr = JSON.stringify(exportData, null, 2);
            var blob = new Blob([jsonStr], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            
            var dateStr = new Date().toISOString().split('T')[0];
            var fileName = 'snacks_backup_' + dateStr + '.json';
            
            var a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.style.display = 'none';
            document.body.appendChild(a);
            
            if (typeof a.click === 'function') {
                a.click();
            } else {
                var event = document.createEvent('MouseEvents');
                event.initMouseEvent('click', true, false, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
                a.dispatchEvent(event);
            }
            
            setTimeout(function() {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);

            showToast('已导出 ' + snacks.length + ' 条记录');
        }

        function importDataFromFile(file) {
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var imported = JSON.parse(e.target.result);
                    
                    if (!imported.data || !Array.isArray(imported.data)) {
                        showToast('文件格式不正确');
                        return;
                    }

                    var importCount = imported.data.length;
                    
                    if (importCount === 0) {
                        showToast('文件中没有数据');
                        return;
                    }

                    var mergeMode = confirm(
                        '即将导入 ' + importCount + ' 条记录。\n\n' +
                        '点击「确定」合并到现有数据（保留两条记录）。\n' +
                        '点击「取消」替换所有现有数据。'
                    );

                    if (mergeMode) {
                        var oldCount = snacks.length;
                        snacks = snacks.concat(imported.data);
                        if (imported.images) {
                            Object.assign(imageStore, imported.images);
                            saveImageStore();
                        }
                        showToast('已合并，新增 ' + importCount + ' 条（总计 ' + snacks.length + ' 条）');
                    } else {
                        if (confirm('确定要替换所有现有数据吗？原有数据将丢失！')) {
                            snacks = imported.data;
                            imageStore = imported.images || {};
                            saveImageStore();
                            showToast('已替换为 ' + importCount + ' 条记录');
                        } else {
                            return;
                        }
                    }

                    saveData();
                    renderSnacks();
                    updateStats();
                    updateDataInfo();
                } catch (err) {
                    console.error('导入失败:', err);
                    showToast('导入失败，文件格式错误');
                }
                document.getElementById('importFile').value = '';
            };
            reader.onerror = function() {
                showToast('读取文件失败');
                document.getElementById('importFile').value = '';
            };
            reader.readAsText(file);
        }

        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }

        function handleCameraCapture(file) {
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var maxW = 100;
                    var scale = Math.min(maxW / img.width, 1);
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentImageData = canvas.toDataURL('image/jpeg', 0.4);

                    var addPreview = document.getElementById('addImagePreview');
                    var editPreview = document.getElementById('editImagePreview');
                    if (document.getElementById('addModal').classList.contains('show')) {
                        document.getElementById('addImagePreviewImg').src = currentImageData;
                        addPreview.style.display = '';
                    }
                    if (document.getElementById('editModal').classList.contains('show')) {
                        document.getElementById('editImagePreviewImg').src = currentImageData;
                        editPreview.style.display = '';
                    }
                    showToast('图片已添加');
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                showToast('读取图片失败');
            };
            reader.readAsDataURL(file);
            document.getElementById('cameraInput').value = '';
        }

        function viewImage(src) {
            document.getElementById('viewerImage').src = src;
            document.getElementById('imageViewer').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeImageViewer() {
            document.getElementById('imageViewer').classList.remove('show');
            document.body.style.overflow = '';
        }

        init();
    </script>
    <div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
        <img id="viewerImage" src="" onclick="event.stopPropagation()">
    </div>
</body>
</html>
